<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donut Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#2a1830;--plum2:#3b2446;--glaze:#e8559a;--mint:#1f9d8f;--ink:#241a2b;--bg:#f7f4f8;--card:#fff;--line:#e4dce8;--muted:#7b6d86;--bad:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#f1eaf4;--bg:#17101b;--card:#211727;--line:#372a40;--muted:#a393ae;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex}
a{color:var(--glaze);text-decoration:none}a:hover{text-decoration:underline}
#side{width:260px;flex:none;background:var(--plum);color:#e9dff0;display:flex;flex-direction:column;height:100%;overflow-y:auto;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:2px 8px 16px;color:#fff}
.grp{font-size:12.5px;color:#a994b5;margin:16px 8px 4px}
#side a.nav{display:block;padding:7px 10px;border-radius:8px;color:#e9dff0;font-size:14.5px;border-left:3px solid transparent}
#side a.nav:hover{background:var(--plum2);text-decoration:none}
#side a.nav.on{background:var(--plum2);border-left-color:var(--glaze);color:#fff;font-weight:600}
#quota{margin-top:auto;padding:14px 8px 0;font-size:12.5px;color:#a994b5;border-top:1px solid var(--plum2)}
#wrap{flex:1;min-width:0;height:100%;overflow-y:auto}
#top{display:none;position:sticky;top:0;z-index:5;background:var(--plum);color:#fff;padding:10px 14px;align-items:center;gap:10px}
#top button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
main{padding:26px 30px 60px;max-width:1180px}
h1{font-size:26px;font-weight:800;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
input{min-width:220px}
button{background:var(--glaze);color:#fff;border-color:var(--glaze);cursor:pointer;font-weight:600}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button:hover{filter:brightness(1.06)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.st b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.st span{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.err{background:#c0392b18;border:1px solid var(--bad);color:var(--bad);padding:10px 14px;border-radius:8px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:9px 13px;color:var(--muted);font-size:13.5px;margin:0 0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.chart{width:100%;height:auto;color:var(--glaze)}.chart text{fill:var(--muted);font-size:11px}.chart .g{stroke:var(--line)}
.feed{background:var(--card);border:1px solid var(--line);border-radius:10px;height:60vh;overflow-y:auto;padding:6px 0}
.msg{display:flex;gap:10px;padding:3px 14px;align-items:baseline}.msg .au{font-size:12px;flex:none;width:104px;overflow:hidden;text-overflow:ellipsis}.msg .tx{flex:1;word-break:break-word}.msg time{font-size:11.5px;color:var(--muted)}
.bar2{height:8px;border-radius:4px;background:var(--line);min-width:90px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--mint)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line)}
.tag.ok{background:#1f9d8f26;color:var(--mint)}.tag.warn{background:#e8a63a2b;color:#b9770e}.tag.bad{background:#c0392b22;color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cards .panel{margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--bad)}.dot.on{background:var(--mint)}
@media(max-width:820px){#side{position:fixed;z-index:10;left:-270px;transition:left .2s}#side.open{left:0}#top{display:flex}main{padding:18px 14px 50px}}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>
<aside id="side"></aside>
<div id="wrap">
  <div id="top"><button id="burger" aria-label="Mở menu">☰</button><b>Donut Console</b></div>
  <main id="main"></main>
</div>
<datalist id="items"></datalist>

<script>
/* ============ CẤU HÌNH ============ */
const API_KEY = "dk_JnJFtbsUHKkqGbYHNryDKC5n6gyQDNAr";   // Dán key dạng dk_... vào đây (không bắt buộc). Để trống = chế độ keyless (10 lần/phút).
const BASE = "https://api.donutapi.app";
/* ================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => n == null ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
const short = n => { if (n == null) return "–"; n = +n; const a = Math.abs(n); for (const [u, s] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) if (a >= u) return +(n / u).toFixed(2) + s; return +n.toFixed(2) + ""; };
const dt = ms => ms ? new Date(ms).toLocaleString("vi-VN") : "–";
const ago = ms => { if (!ms) return "–"; const s = Math.max(0, (Date.now() - ms) / 1000 | 0); return s < 60 ? s + " giây trước" : s < 3600 ? (s / 60 | 0) + " phút trước" : s < 86400 ? (s / 3600 | 0) + " giờ trước" : (s / 86400 | 0) + " ngày trước"; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hue = s => Math.abs([...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % 360;
const st = (l, v, sub = "") => `<div class="st"><span>${esc(l)}</span><b>${esc(v)}</b><span>${esc(sub)}</span></div>`;
const table = (cols, rows, empty = "Không có dữ liệu.") => rows.length ? `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.c || ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.c || ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">${empty}</p>`;
const itemLink = i => `<a href="#/ah/${encodeURIComponent(i)}">${esc(i)}</a>`;
const playerLink = p => `<a href="#/player/${encodeURIComponent(p)}">${esc(p)}</a>`;

/* ---------- API ---------- */
const cache = new Map();
async function api(path, { ttl = 60000, timeout = 20000 } = {}) {
  const c = cache.get(path);
  if (ttl && c && Date.now() - c.t < ttl) return c.d;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
  const headers = API_KEY ? { Authorization: "Bearer " + API_KEY } : {};
  let r;
  try { r = await fetch(BASE + path, { headers, signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "Quá thời gian chờ, thử lại sau." : "Không kết nối được tới API."); }
  finally { clearTimeout(tm); }
  quota(r);
  let d = null; try { d = await r.json(); } catch { }
  if (r.status === 202) return { _pending: true, ...d };
  if (!r.ok) {
    const e = new Error((d && d.error) || "Lỗi HTTP " + r.status); e.status = r.status; e.retry = r.headers.get("retry-after");
    throw e;
  }
  if (ttl) cache.set(path, { t: Date.now(), d });
  return d;
}
function quota(r) {
  const g = h => r.headers.get(h), p = g("x-ratelimit-plan");
  if (!p) return;
  $("#quota").innerHTML = `Gói: <b>${esc(p)}</b><br>Còn ${esc(g("x-ratelimit-remaining-minute"))}/${esc(g("x-ratelimit-limit-minute"))} lần phút này<br>Còn ${num(g("x-ratelimit-remaining-month"))} lần tháng này`;
}
let itemsLoaded = false;
async function ensureItems() {
  if (itemsLoaded) return; itemsLoaded = true;
  try { const d = await api("/v1/ah/items", { ttl: 600000 }); $("#items").innerHTML = d.items.map(i => `<option value="${esc(i.item)}">`).join(""); } catch { itemsLoaded = false; }
}
const itemBox = (v = "", id = "item") => `<input id="${id}" list="items" placeholder="vd: netherite_ingot" value="${esc(v)}" autocomplete="off">`;

/* ---------- Biểu đồ SVG ---------- */
function chart(pts, { w = 900, h = 260, fmt = short, tfmt = ms => new Date(ms).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) } = {}) {
  if (pts.length < 2) return `<p class="muted">Chưa đủ điểm dữ liệu để vẽ biểu đồ.</p>`;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const P = { l: 58, r: 12, t: 12, b: 26 }, X = x => P.l + (x - x0) / (x1 - x0 || 1) * (w - P.l - P.r), Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (h - P.t - P.b);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("");
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4, y = Y(v); g += `<line class="g" x1="${P.l}" x2="${w - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${esc(fmt(v))}</text>`; }
  [0, .5, 1].forEach((f, i) => { const t = x0 + (x1 - x0) * f; g += `<text x="${X(t)}" y="${h - 6}" text-anchor="${i === 0 ? "start" : i === 2 ? "end" : "middle"}">${esc(tfmt(t))}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}<path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/* ---------- Các màn hình ---------- */
async function vStatus(el) {
  const d = await api("/v1/status", { ttl: 15000 }), b = d.bots_summary || {}, s = (d.donutsmp || [])[0] || {}, t = d.traffic || {};
  el.innerHTML = `<div class="stats">
    ${st("DonutSMP", s.online ? "Online" : s.online === false ? "Offline" : "Chưa rõ", s.host || "")}
    ${st("Người chơi", num(s.players_online), "tối đa " + num(s.players_max))}
    ${st("Ping", s.latency_ms != null ? s.latency_ms + " ms" : "–", "đo từ máy chủ ở Đức")}
    ${st("Bot trong game", `${b.online ?? "–"}/${b.total ?? "–"}`, b.state || "")}
    ${st("Snapshot AH", ago(d.ah?.ts), `${d.ah?.pages ?? 0} trang${d.ah?.complet ? "" : " (chưa đủ)"}`)}
    ${st("Snapshot Orders", ago(d.orders?.ts), `${d.orders?.pages ?? 0} trang${d.orders?.complet ? "" : " (chưa đủ)"}`)}
    ${st("Lưu lượng API", t.level || "–", `${t.requests_per_minute ?? 0} req/phút · hàng đợi ${t.player_queue ?? 0}`)}</div>
    ${table([{ h: "Bot", f: r => `<span class="dot ${r.online ? "on" : ""}"></span>${esc(r.name)}` }, { h: "Trạng thái", f: r => esc(r.state) }, { h: "Việc đang làm", f: r => esc(r.task || "–") }, { h: "Thấy lần cuối", f: r => ago(r.last_seen) }, { h: "Uptime 24h", c: "n", f: r => r.uptime_24h == null ? "–" : (r.uptime_24h * 100).toFixed(1) + "%" }], d.bots || [])}`;
}

async function vUptime(el, [h = "24"]) {
  el.innerHTML = `<form class="bar"><select id="hrs">${[1, 6, 24, 72, 168, 720].map(x => `<option ${x == h ? "selected" : ""} value="${x}">${x} giờ</option>`).join("")}</select><button>Xem</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); location.hash = "#/uptime/" + $("#hrs").value; };
  const d = await api("/v1/status/history?hours=" + h, { ttl: 30000 }), s = d.servers || [];
  $("#out").innerHTML = `<p class="note">Lịch sử bắt đầu ghi từ ${dt(d.logging_since)}. Khoảng trống nghĩa là API đang khởi động lại, không phải server sập.</p>` +
    s.map(v => `<div class="panel"><b>${esc(v.name)}</b> <span class="muted">${esc(v.host)} · uptime ${v.uptime == null ? "–" : (v.uptime * 100).toFixed(2) + "%"}</span>
      <p class="muted" style="margin:10px 0 2px">Người chơi online</p>${chart(v.points.filter(p => p.players != null).map(p => ({ x: p.at, y: p.players })))}
      <p class="muted" style="margin:10px 0 2px">Ping (ms)</p>${chart(v.points.filter(p => p.latency_ms != null).map(p => ({ x: p.at, y: p.latency_ms })), { h: 180, fmt: n => n.toFixed(0) })}
      ${v.outages?.length ? table([{ h: "Bắt đầu", f: o => dt(o.from) }, { h: "Kết thúc", f: o => o.to ? dt(o.to) : "đang diễn ra" }, { h: "Lỗi", f: o => esc(o.error || "") }], v.outages) : `<p class="muted">Không ghi nhận gián đoạn.</p>`}</div>`).join("");
}

async function vAhItems(el) {
  const d = await api("/v1/ah/items", { ttl: 120000 });
  let all = d.items || [], lim = 200;
  el.innerHTML = `<p class="note">Snapshot ${ago(d.snapshot?.at)} · ${all.length} loại item. Item có dấu ★ được tìm trực tiếp trong game nên giá thấp nhất là giá thật; item còn lại đến từ lượt quét một phần nên kém chắc chắn hơn.</p>
    <form class="bar"><input id="f" placeholder="Lọc theo tên item"><select id="o"><option value="n">Tên A–Z</option><option value="pa">Giá thấp → cao</option><option value="pd">Giá cao → thấp</option><option value="l">Nhiều listing nhất</option></select></form><div id="out"></div>`;
  const draw = () => {
    const f = $("#f", el).value.trim().toLowerCase().replace(/ /g, "_"), o = $("#o", el).value;
    let r = all.filter(i => i.item.includes(f));
    if (o === "pa") r.sort((a, b) => a.lowest_unit_price - b.lowest_unit_price); if (o === "pd") r.sort((a, b) => b.lowest_unit_price - a.lowest_unit_price); if (o === "l") r.sort((a, b) => b.listings - a.listings);
    $("#out", el).innerHTML = table([{ h: "Item", f: i => itemLink(i.item) + (i.priced_at ? " ★" : "") }, { h: "Giá thấp nhất / cái", c: "n", f: i => short(i.lowest_unit_price) + ` <span class="muted">(${num(i.lowest_unit_price)})</span>` }, { h: "Listing", c: "n", f: i => num(i.listings) }, { h: "Tổng số lượng", c: "n", f: i => num(i.total_count) }], r.slice(0, lim)) +
      (r.length > lim ? `<p class="muted">Hiển thị ${lim}/${r.length}. <a href="#" id="more">Hiện thêm</a></p>` : "");
    const m = $("#more", el); if (m) m.onclick = e => { e.preventDefault(); lim += 300; draw(); };
  };
  $("#f", el).oninput = draw; $("#o", el).onchange = draw; draw();
}

async function vAh(el, [item = ""]) {
  ensureItems();
  el.innerHTML = `<form class="bar">${itemBox(item)}<button>Tìm offer</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); const v = $("#item").value.trim().toLowerCase().replace(/ /g, "_"); if (v) location.hash = "#/ah/" + encodeURIComponent(v); };
  if (!item) return $("#out").innerHTML = `<p class="muted">Nhập id item (chữ thường, gạch dưới) hoặc chọn từ <a href="#/ahitems">danh sách tổng quan</a>.</p>`;
  $("#out").innerHTML = `<p class="muted">Đang tìm trong game… item ít phổ biến có thể mất 4–9 giây.</p>`;
  const d = await api("/v1/ah?item=" + encodeURIComponent(item) + "&limit=45", { ttl: 60000, timeout: 25000 }), l = d.listings || [];
  $("#out").innerHTML = `<p class="note">Dữ liệu ${ago(d.snapshot?.at)} · ${d.snapshot?.source === "search" ? "tìm trực tiếp trong game (giá thấp nhất là giá thật)" : "lượt quét một phần, danh sách có thể thiếu"} · <a href="#/history/${encodeURIComponent(item)}/ah/24">xem lịch sử giá</a></p>` +
    (l.length ? `<div class="stats">${st("Giá thấp nhất / cái", short(l[0].unit_price), num(l[0].unit_price))}${st("Số offer", l.length)}</div>` : "") +
    table([{ h: "Item", f: r => esc(r.name || r.item) }, { h: "Số lượng", c: "n", f: r => num(r.count) }, { h: "Tổng giá", c: "n", f: r => short(r.price) + ` <span class="muted">(${num(r.price)})</span>` }, { h: "Giá / cái", c: "n", f: r => short(r.unit_price) }], l, "Không tìm thấy offer. Danh sách rỗng không chứng minh item không được bán.");
}

async function vOrders(el, [item = ""]) {
  ensureItems();
  el.innerHTML = `<form class="bar">${itemBox(item)}<button>Lọc</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); const v = $("#item").value.trim().toLowerCase().replace(/ /g, "_"); location.hash = "#/orders" + (v ? "/" + encodeURIComponent(v) : ""); };
  const d = await api("/v1/orders?limit=200" + (item ? "&item=" + encodeURIComponent(item) : "")), o = d.orders || [];
  $("#out").innerHTML = `<p class="note">Snapshot ${ago(d.snapshot?.at)}${d.snapshot?.complete === false ? " · chưa đủ, danh sách chỉ là một phần" : ""}.</p>` +
    table([{ h: "Item", f: r => itemLink(r.item) + ` <span class="muted">${esc(r.name || "")}</span>` }, { h: "Giá mua / cái", c: "n", f: r => short(r.price_each) }, { h: "Đã giao", c: "n", f: r => short(r.delivered) }, { h: "Cần", c: "n", f: r => short(r.wanted) }, { h: "Tiến độ", f: r => { const p = r.wanted ? Math.min(100, r.delivered / r.wanted * 100) : 0; return `<div class="bar2" title="${p.toFixed(1)}%"><i style="width:${p}%"></i></div>`; } }], o);
}

async function vHistory(el, [item = "", type = "ah", hours = "24"]) {
  ensureItems();
  el.innerHTML = `<form class="bar">${itemBox(item)}<select id="ty"><option value="ah" ${type === "ah" ? "selected" : ""}>Auction house</option><option value="orders" ${type === "orders" ? "selected" : ""}>Buy orders</option></select><select id="hr">${[6, 24, 72, 168, 720].map(x => `<option value="${x}" ${x == hours ? "selected" : ""}>${x} giờ</option>`).join("")}</select><button>Xem</button></form><p class="note">Không có key chỉ xem được tối đa 24 giờ. Gói cao hơn xem được lâu hơn.</p><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); const v = $("#item").value.trim().toLowerCase().replace(/ /g, "_"); if (v) location.hash = `#/history/${encodeURIComponent(v)}/${$("#ty").value}/${$("#hr").value}`; };
  if (!item) return;
  const d = await api(`/v1/history?item=${encodeURIComponent(item)}&type=${type}&hours=${hours}`), p = d.points || [];
  if (!p.length) return $("#out").innerHTML = `<p class="muted">Chưa có điểm dữ liệu cho item này trong khoảng thời gian đã chọn.</p>`;
  const f = p[0].price, l = p[p.length - 1].price, mn = Math.min(...p.map(x => x.price)), mx = Math.max(...p.map(x => x.price)), ch = f ? (l - f) / f * 100 : 0;
  $("#out").innerHTML = `<div class="stats">${st("Giá gần nhất", short(l), num(l))}${st("Thấp nhất", short(mn))}${st("Cao nhất", short(mx))}${st("Thay đổi", (ch >= 0 ? "+" : "") + ch.toFixed(1) + "%", p.length + " điểm")}</div>
    <div class="panel"><b>Giá</b>${chart(p.map(x => ({ x: x.at, y: x.price })))}</div><div class="panel"><b>Số listing</b>${chart(p.map(x => ({ x: x.at, y: x.listings })), { h: 180, fmt: n => n.toFixed(0) })}</div>`;
}

function vChat(el, [q = ""]) {
  el.innerHTML = `<p class="note">Tên người chơi không bao giờ hiện: mỗi người chỉ có một mã ẩn danh cố định. Nội dung do người chơi viết, được hiển thị dạng văn bản thuần. Tự cập nhật mỗi 10 giây (giữ dưới giới hạn 10 lần/phút của keyless).</p>
    <form class="bar"><input id="q" placeholder="Tìm trong lịch sử chat (tối đa 6 từ)" value="${esc(q)}"><button>Tìm</button>${q ? `<button type="button" class="ghost" id="clr">Về chat trực tiếp</button>` : `<button type="button" class="ghost" id="pz">Tạm dừng</button>`}<span id="stt" class="muted"></span></form><div id="feed" class="feed"></div>`;
  const feed = $("#feed", el); let last = 0, paused = false, busy = false;
  $("form", el).onsubmit = e => { e.preventDefault(); const v = $("#q").value.trim(); location.hash = "#/chat" + (v ? "/" + encodeURIComponent(v) : ""); };
  const c = $("#clr", el); if (c) c.onclick = () => location.hash = "#/chat";
  const row = m => `<div class="msg"><span class="au" style="color:hsl(${hue(m.author)} 55% 45%)">${esc(m.author)}</span><span class="tx">${esc(m.text)}</span><time>${new Date(m.at).toLocaleTimeString("vi-VN")}</time></div>`;
  async function load(first) {
    if (busy) return; busy = true;
    try {
      const d = await api(q ? `/v1/chat?limit=100&q=${encodeURIComponent(q)}` : first ? "/v1/chat?limit=100" : `/v1/chat?limit=100&after=${last}`, { ttl: 0 });
      const near = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 80;
      if (first) feed.innerHTML = "";
      if (!d.messages.length && first) feed.innerHTML = `<p class="muted" style="padding:10px 14px">Không có tin nhắn.</p>`;
      feed.insertAdjacentHTML("beforeend", d.messages.map(row).join(""));
      last = d.latest_id ?? last;
      if (first || near) feed.scrollTop = feed.scrollHeight;
      $("#stt", el).textContent = "";
    } catch (e) { $("#stt", el).textContent = e.message + (e.retry ? ` (thử lại sau ${e.retry}s)` : ""); }
    busy = false;
  }
  load(true);
  if (!q) {
    const pz = $("#pz", el); pz.onclick = () => { paused = !paused; pz.textContent = paused ? "Tiếp tục" : "Tạm dừng"; };
    later(() => { if (!paused) load(false); }, 10000);
  }
}

async function vDaily(el, [day = ""]) {
  el.innerHTML = `<form class="bar"><input id="day" type="date" value="${esc(day)}"><button>Xem</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); location.hash = "#/daily" + ($("#day").value ? "/" + $("#day").value : ""); };
  let d;
  try { d = await api("/v1/chat/daily" + (day ? "?day=" + encodeURIComponent(day) : ""), { ttl: 300000 }); }
  catch (e) { if (e.status === 404) return $("#out").innerHTML = `<p class="muted">Ngày này chưa có dữ liệu chat.</p>`; throw e; }
  const mx = Math.max(1, ...(d.top_words || []).map(w => w.count));
  $("#out").innerHTML = `<p class="note">Ngày ${esc(d.day)} (UTC)${d.partial ? " · ngày chưa kết thúc, số liệu cập nhật mỗi giờ" : ""}.</p>
    <div class="stats">${st("Tin nhắn", num(d.messages))}${st("Người nhắn", num(d.authors))}${st("Giờ sôi động nhất", d.busiest_hour ? d.busiest_hour.hour + ":00 UTC" : "–", d.busiest_hour ? num(d.busiest_hour.messages) + " tin" : "")}${st("Nhắn nhiều nhất", d.top_chatter?.author || "–", d.top_chatter ? num(d.top_chatter.messages) + " tin" : "")}</div>
    ${d.top_chatter?.head ? `<p><img src="${esc(d.top_chatter.head)}" width="48" height="48" alt="Đầu nhân vật của người nhắn nhiều nhất" style="image-rendering:pixelated;border-radius:6px"></p>` : ""}
    <div class="panel"><b>Từ được nói nhiều nhất</b><div style="margin-top:8px">${(d.top_words || []).map(w => `<div style="display:flex;gap:10px;align-items:center;margin:4px 0"><span style="width:110px">${esc(w.word)}</span><div class="bar2" style="flex:1"><i style="width:${w.count / mx * 100}%"></i></div><span class="n muted" style="width:64px;text-align:right">${num(w.count)}</span></div>`).join("") || `<span class="muted">Không có.</span>`}</div></div>
    ${d.topics?.length || d.summary ? `<div class="panel"><b>Chủ đề và tóm tắt</b> <span class="tag warn">AI ước tính, có thể sai</span>${(d.topics || []).map(t => `<div style="margin:6px 0">${esc(t.label)} <span class="muted">~${Math.round(t.share * 100)}%</span></div>`).join("")}${d.summary ? `<p>${esc(d.summary)}</p>` : ""}${d.summary_model ? `<span class="muted">Mô hình: ${esc(d.summary_model)}</span>` : ""}</div>` : ""}`;
}

async function vRich(el, [n = "50"]) {
  el.innerHTML = `<form class="bar"><select id="n">${[25, 50, 100, 200].map(x => `<option value="${x}" ${x == n ? "selected" : ""}>Top ${x}</option>`).join("")}</select><button>Xem</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); location.hash = "#/rich/" + $("#n").value; };
  const d = await api("/v1/leaderboard/money?limit=" + n, { ttl: 120000 });
  $("#out").innerHTML = `<p class="note">Snapshot ${ago(d.snapshot?.at)} · tính năng beta · số tiền được game làm tròn 2–3 chữ số có nghĩa.</p>` +
    table([{ h: "Hạng", c: "n", f: r => r.rank }, { h: "Người chơi", f: r => playerLink(r.player) }, { h: "Số tiền", c: "n", f: r => `<b>${short(r.money)}</b> <span class="muted">(${num(r.money)})</span>` }], d.players || []);
}

async function vPlayer(el, [name = ""]) {
  el.innerHTML = `<form class="bar"><input id="nm" placeholder="Tên Java, hoặc Bedrock có dấu chấm đầu" value="${esc(name)}" maxlength="16"><button>Tra cứu</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); const v = $("#nm").value.trim(); if (v) location.hash = "#/player/" + encodeURIComponent(v); };
  if (!name) return $("#out").innerHTML = `<p class="muted">Nhập tên người chơi để xem thống kê. Lần đầu có thể mất 2–6 giây, kết quả được cache 10 phút.</p>`;
  const out = $("#out"); let d;
  try {
    for (let i = 0; i < 6; i++) {
      out.innerHTML = `<p class="muted">Đang hỏi game${i ? ` (lần thử ${i + 1})` : ""}…</p>`;
      d = await api("/v1/player/" + encodeURIComponent(name), { ttl: 600000, timeout: 25000 });
      if (!d._pending) break; await sleep((d.retry_in_seconds || 5) * 1000);
    }
  } catch (e) {
    if (e.status === 404) return out.innerHTML = `<p class="muted">Game báo người chơi này không tồn tại.</p>`;
    if (e.status === 400) return out.innerHTML = `<p class="muted">Tên người chơi không hợp lệ (2–16 ký tự).</p>`;
    if (e.status === 503) return out.innerHTML = `<div class="err">Đang có quá nhiều lượt tra cứu chờ xử lý. Thử lại sau ít phút.</div>`;
    throw e;
  }
  if (d._pending) return out.innerHTML = `<div class="err">Game chưa phản hồi. Thử lại sau ít phút.</div>`;
  const s = d.stats || {}, kd = s.deaths ? (s.kills / s.deaths).toFixed(2) : "–";
  out.innerHTML = `<h2 style="margin:0 0 10px">${esc(d.player)}</h2><p class="note">Đọc ${ago(d.at)}${d.cached ? " (từ cache)" : ""} · số liệu được game làm tròn.</p>
    <div class="stats">${st("Tiền", short(s.money), num(s.money))}${st("Kills", num(s.kills))}${st("Deaths", num(s.deaths))}${st("K/D", kd)}${st("Thời gian chơi", s.playtime || "–")}
    ${s.shards != null ? st("Shards", num(s.shards)) : ""}${s.blocks_placed != null ? st("Block đặt", num(s.blocks_placed)) : ""}${s.blocks_broken != null ? st("Block phá", num(s.blocks_broken)) : ""}${s.mobs_killed != null ? st("Mob giết", num(s.mobs_killed)) : ""}</div>`;
}

async function vStaff(el, [mode = "online"]) {
  el.innerHTML = `<form class="bar"><select id="m"><option value="online" ${mode === "online" ? "selected" : ""}>Đang online</option><option value="all" ${mode === "all" ? "selected" : ""}>Tất cả đã thấy</option></select><button>Xem</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); location.hash = "#/staff/" + $("#m").value; };
  const all = mode === "all", d = await api(all ? "/v1/staff" : "/v1/staff/online", { ttl: 30000 }), s = d.staff || [];
  const role = r => r.role ? `<span class="tag">${esc(r.role)}</span>` : `<span class="muted">chưa rõ</span>`;
  $("#out").innerHTML = `<p class="note">Đây là "staff được bot nhìn thấy online", không phải toàn bộ staff. Staff đang ẩn sẽ không xuất hiện, nên vắng mặt không chứng minh họ offline.</p>` +
    table(all
      ? [{ h: "Tên", f: r => esc(r.player) + (r.previous_name ? ` <span class="muted">(trước: ${esc(r.previous_name)})</span>` : "") }, { h: "Vai trò", f: role }, { h: "Trạng thái", f: r => `<span class="dot ${r.online ? "on" : ""}"></span>${r.online ? "online" : "offline"}${r.spectator ? " · spectator" : ""}` }, { h: "Thấy lần cuối", f: r => ago(r.last_seen) }, { h: "Thấy lần đầu", f: r => dt(r.first_seen) }]
      : [{ h: "Tên", f: r => esc(r.player) }, { h: "Vai trò", f: role }, { h: "Chế độ", f: r => r.spectator ? "spectator" : "bình thường" }], s, "Hiện không thấy staff nào online.");
}

async function vStaffAct(el, [days = "30"]) {
  el.innerHTML = `<form class="bar"><select id="d">${[1, 7, 14, 30, 90].map(x => `<option value="${x}" ${x == days ? "selected" : ""}>${x} ngày</option>`).join("")}</select><button>Xem</button></form><div id="out"></div>`;
  $("form", el).onsubmit = e => { e.preventDefault(); location.hash = "#/staffact/" + $("#d").value; };
  const d = await api("/v1/staff/activity?days=" + days, { ttl: 600000 });
  const bars = a => { const m = Math.max(1, ...a); return `<svg width="144" height="26" viewBox="0 0 144 26" role="img" aria-label="Phút online theo giờ trong ngày">${a.map((v, i) => `<rect x="${i * 6}" y="${26 - v / m * 24}" width="5" height="${Math.max(v ? 1 : 0, v / m * 24)}" fill="var(--mint)"/>`).join("")}</svg>`; };
  $("#out").innerHTML = `<p class="note">Log bắt đầu từ ${dt(d.logging_since)}; nếu mới chỉ vài ngày thì chưa đủ để kết luận thói quen. Thời gian là mức tối thiểu (chỉ tính lúc bot thấy staff). Múi giờ: ${esc(d.timezone)}.</p>` +
    table([{ h: "Tên", f: r => esc(r.player) }, { h: "Vai trò", f: r => esc(r.role || "–") }, { h: "Tổng phút", c: "n", f: r => num(r.total_minutes) }, { h: "Phiên", c: "n", f: r => num(r.sessions) }, { h: "Trung vị/phiên", c: "n", f: r => r.median_session_minutes + " phút" }, { h: "Giờ hay online", f: r => (r.usual_hours || []).map(h => h + "h").join(", ") || "–" }, { h: "Theo giờ (0–23)", f: r => bars(r.minutes_by_hour || []) }, { h: "Thấy lần cuối", f: r => ago(r.last_seen) }], d.staff || []);
}

async function vMods(el) {
  el.innerHTML = `<p class="note">Chợ mod của Donut API: người mua trả trực tiếp cho người bán trong game, không hoàn tiền được. Điểm quét chỉ tìm mã độc đã biết, không đảm bảo file an toàn. Màn hình này chỉ xem danh sách; việc mua cần làm trên trang mod.</p><div class="cards" id="c"></div><p><button class="ghost" id="more" hidden>Tải thêm</button></p>`;
  let before = null;
  const verdict = v => `<span class="tag ${v === "OK" ? "ok" : v === "ATTENTION" ? "warn" : "bad"}">${esc(v)}</span>`;
  async function load() {
    const d = await api("/v1/market/mods?limit=24" + (before ? "&before=" + before : ""), { ttl: 60000 });
    $("#c").insertAdjacentHTML("beforeend", (d.mods || []).map(m => `<div class="panel"><b>${esc(m.name)}</b> <span class="muted">${esc(m.version || "")}</span><p class="muted" style="margin:4px 0 8px">${esc(m.description || "Không có mô tả.")}</p>
      <div>${verdict(m.scan?.verdict)} <span class="tag">${short(m.price)} · người bán ${esc(m.seller)}</span></div>
      ${(m.scan?.findings || []).map(f => `<div class="muted" style="font-size:13px">• ${esc(f.severity)}: ${esc(f.title)}</div>`).join("")}
      <p class="muted" style="font-size:12.5px;margin:8px 0 0">${esc(m.file?.name)} · ${num((m.file?.size || 0) / 1024)} KB<br>sha256: ${esc((m.file?.sha256 || "").slice(0, 20))}…</p><a href="${esc(m.page_url)}" target="_blank" rel="noopener">Mở trang mod</a></div>`).join("") || `<p class="muted">Chưa có mod nào.</p>`);
    before = d.next_before; $("#more").hidden = !before;
  }
  $("#more").onclick = () => load().catch(e => alert(e.message));
  await load();
}

/* ---------- Điều hướng ---------- */
const NAV = [
  ["Thị trường", [["ahitems", "Tổng quan Auction House", "Giá thấp nhất và số listing của từng item.", vAhItems], ["ah", "Offer theo item", "Danh sách offer rẻ nhất của một item.", vAh], ["orders", "Buy orders", "Các lệnh mua đang mở.", vOrders], ["history", "Lịch sử giá", "Biểu đồ giá và số listing theo thời gian.", vHistory]]],
  ["Cộng đồng", [["chat", "Chat công khai", "Theo dõi và tìm kiếm chat của server.", vChat], ["daily", "Thống kê chat theo ngày", "Số tin, từ khóa và giờ sôi động.", vDaily]]],
  ["Người chơi", [["rich", "Bảng xếp hạng tiền", "Những người giàu nhất server (beta).", vRich], ["player", "Tra cứu người chơi", "Tiền, K/D, thời gian chơi (beta).", vPlayer], ["staff", "Staff", "Staff mà bot thấy trong danh sách người chơi (beta).", vStaff], ["staffact", "Hoạt động của staff", "Khung giờ staff thường online (beta).", vStaffAct]]],
  ["Hệ thống", [["status", "Trạng thái", "Bot, server DonutSMP và độ mới của dữ liệu.", vStatus], ["uptime", "Lịch sử server", "Người chơi, ping và các lần gián đoạn.", vUptime]]],
  ["Chợ mod", [["mods", "Mod đang bán", "Danh sách mod bán bằng tiền trong game.", vMods]]]
];
const ROUTES = Object.fromEntries(NAV.flatMap(g => g[1]).map(r => [r[0], r]));
$("#side").innerHTML = `<div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8559a"/><circle cx="16" cy="16" r="5" fill="#2a1830"/><g stroke-width="2.4" stroke-linecap="round"><path d="M8 10l2 1" stroke="#fff"/><path d="M22 8l-1 2" stroke="#ffd166"/><path d="M25 17l-2 0" stroke="#7fe0d6"/><path d="M20 25l-1-2" stroke="#fff"/><path d="M9 21l2-1" stroke="#ffd166"/></g></svg>Donut Console</div>` +
  `<a class="nav" href="index.html" style="background:var(--glaze);color:#fff;font-weight:600;text-align:center;margin:0 0 4px">← Craft Optimizer</a>` +
  NAV.map(([g, rs]) => `<div class="grp">${g}</div>` + rs.map(r => `<a class="nav" data-r="${r[0]}" href="#/${r[0]}">${r[1]}</a>`).join("")).join("") + `<div id="quota">Chưa có lượt gọi nào.</div>`;
$("#burger").onclick = () => $("#side").classList.toggle("open");

let timers = [], gen = 0;
const later = (f, ms) => timers.push(setInterval(f, ms));
async function route() {
  timers.forEach(clearInterval); timers = []; const my = ++gen;
  const [name, ...args] = (location.hash.replace(/^#\/?/, "") || "ahitems").split("/").map(s => s);
  const r = ROUTES[name] || ROUTES.ahitems;
  document.querySelectorAll("#side a.nav").forEach(a => a.classList.toggle("on", a.dataset.r === r[0]));
  $("#side").classList.remove("open"); $("#wrap").scrollTop = 0;
  const m = $("#main"); m.innerHTML = `<h1>${r[1]}</h1><p class="sub">${r[2]}</p><div id="view"><p class="muted">Đang tải…</p></div>`;
  const v = $("#view");
  try {
    v.innerHTML = "";
    await r[3](v, args.map(a => { try { return decodeURIComponent(a) } catch { return a } }));
  } catch (e) {
    if (my !== gen) return;
    const extra = e.status === 429 ? (e.retry ? ` Chờ ${e.retry} giây rồi thử lại.` : "") : e.status === 401 ? " Kiểm tra lại API_KEY trong code." : "";
    v.insertAdjacentHTML("beforeend", `<div class="err">${esc(e.message)}${extra}</div>`);
  }
}
addEventListener("hashchange", route);
route();
</script>
