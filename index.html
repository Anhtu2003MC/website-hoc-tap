    <div style="flex:1;min-width:0"><div class="nav-label">KHÔNG GIAN HỌC</div><nav class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="nav-ico">▦</span>Tổng quan</button>
      <button data-page="assignments"><span class="nav-ico">▤</span>Bài tập</button>
      <button data-page="repository"><span class="nav-ico">🌐</span>Kho đề cộng đồng</button>
      <button data-page="create"><span class="nav-ico">＋</span>Đăng bài tập</button>
      <button data-page="history"><span class="nav-ico">◷</span>Lịch sử</button>
      <button data-page="mistakes"><span class="nav-ico">◎</span>Sổ lỗi sai</button>
    </nav></div>
    <div class="sidebar-bottom"><strong>☁️ Kho đề cộng đồng</strong><p>Bài tập cá nhân được lưu trên máy. Đề trong kho cộng đồng cần cấu hình máy chủ chung để mọi người cùng xem và đăng.</p></div>
  </aside>
  <main class="main">
    <div class="topbar"><div class="breadcrumb">Không gian học tập <span style="margin:0 7px;color:#c4cada">/</span><b id="crumb">Tổng quan</b></div><div class="top-actions"><span class="small muted" id="cloud-status">Kho đề chưa kết nối</span><div class="avatar">HT</div></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast-root"></div>
<script>
(() => {
'use strict';
const STORE_KEY='hoctot_assignments_v1', HISTORY_KEY='hoctot_history_v1', NOTES_KEY='hoctot_notes_v1';
// CẤU HÌNH KHO ĐỀ DÙNG CHUNG: điền URL dự án Supabase và khóa anon/publishable của dự án. KHÔNG dùng service_role key ở trình duyệt.
const SUPABASE_CONFIG={url:'https://lbjeffrdlcveyxkjhcrj.supabase.co',anonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiamVmZnJkbGN2ZXl4a2poY3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTEwNTQsImV4cCI6MjEwNzU2NzA1NH0.cBaP-dJS60hbHriWEvld5vnk34EWr9oqp4rXCid-7tY',table:'hoctot_papers'};
const state={page:'dashboard',assignments:load(STORE_KEY,[]),history:load(HISTORY_KEY,[]),notes:load(NOTES_KEY,[]),repositoryPapers:[],repositoryStatus:'not-configured',repositoryError:'',repoSearch:'',repoSubject:'',draft:{title:'',subject:'',group:'',duration:30,description:'',questionText:'',answerText:'',questions:[],keyMap:{},qFile:'',aFile:''},editingId:null,test:null,lastAttempt:null,historySearch:'',mistakeSearch:''};
let timer=null, toastTimer=null;
const view=document.getElementById('view');
function load(k,fb){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:fb}catch(e){return fb}}
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(state.assignments));localStorage.setItem(HISTORY_KEY,JSON.stringify(state.history));localStorage.setItem(NOTES_KEY,JSON.stringify(state.notes))}
function cloudReady(){return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(SUPABASE_CONFIG.url||'').trim())&&String(SUPABASE_CONFIG.anonKey||'').trim().length>15}
function cloudHeaders(extra={}){return {'apikey':SUPABASE_CONFIG.anonKey,'Authorization':'Bearer '+SUPABASE_CONFIG.anonKey,'Content-Type':'application/json',...extra}}
function cloudUrl(){return String(SUPABASE_CONFIG.url||'').trim().replace(/\/$/,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}
function setPage(p){if(timer && p!=='test' && state.page==='test'){/* keep timer running if user navigates only within test */}state.page=p;render();if(p==='repository')refreshRepository(false)}
function updateCrumb(){const map={dashboard:'Tổng quan',assignments:'Bài tập',repository:'Kho đề cộng đồng',create:state.editingId?'Chỉnh sửa bài tập':'Đăng bài tập',test:'Làm bài kiểm tra',result:'Kết quả bài làm',history:'Lịch sử',mistakes:'Sổ lỗi sai'};document.getElementById('crumb').textContent=map[state.page]||'Học Tốt';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page||(state.page==='test'||state.page==='result')&&b.dataset.page==='assignments'));const status=document.getElementById('cloud-status');if(status)status.textContent=cloudReady()?'Kho đề cộng đồng đã cấu hình':'Kho đề chưa kết nối'}
function dateFmt(iso){try{return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}catch(e){return ''}}
function fmtType(t){return t==='mcq'?'Trắc nghiệm A–D':t==='tf'?'Đúng / Sai':'Trả lời ngắn'}
function typePill(t){return `<span class="pill neutral">${fmtType(t)}</span>`}
function assignmentCard(a,compact=false){return `<div class="assignment-row"><div class="subject-icon">${a.subject?.toLowerCase().includes('toán')?'∑':a.subject?.toLowerCase().includes('anh')?'文':a.subject?.toLowerCase().includes('lý')?'⚡':'✎'}</div><div class="assignment-info"><strong>${esc(a.title)}</strong><span>${esc(a.subject||'Chưa phân môn')} · ${a.questions.length} câu · ${Number(a.duration)||30} phút${a.group?' · '+esc(a.group):''}</span></div>${compact?'':`<div class="toolbar"><button class="btn btn-primary btn-sm" data-action="start-test" data-id="${esc(a.id)}">Làm bài ↗</button><button class="btn btn-soft btn-sm" data-action="publish-paper" data-id="${esc(a.id)}" title="Chia sẻ lên kho đề cộng đồng">🌐 Đăng lên kho</button><button class="btn btn-outline btn-sm" data-action="edit-assignment" data-id="${esc(a.id)}" title="Chỉnh sửa">Sửa</button><button class="btn btn-danger btn-sm" data-action="delete-assignment" data-id="${esc(a.id)}" title="Xóa">×</button></div>`}</div>`}
function renderDashboard(){const totalQ=state.assignments.reduce((n,a)=>n+a.questions.length,0), avg=state.history.length?state.history.reduce((s,h)=>s+(h.score||0),0)/state.history.length:0;return `<section class="welcome-banner"><div><div class="eyebrow" style="color:#e0e5ff">HỌC TẬP THÔNG MINH</div><h2>Sẵn sàng chinh phục bài kiểm tra?</h2><p>Tải đề Word, luyện tập, ghi nhớ lỗi sai và khám phá kho đề cộng đồng để học cùng mọi người.</p><button class="btn" data-action="go-create">＋ Đăng bài tập mới</button></div><div class="banner-art">✎</div></section>
<div class="stats"><div class="card stat"><div class="stat-top"><span>Bài tập đã đăng</span><span class="stat-icon">▤</span></div><div class="stat-value">${state.assignments.length}</div><div class="stat-foot">Bài kiểm tra của bạn</div></div><div class="card stat"><div class="stat-top"><span>Tổng số câu hỏi</span><span class="stat-icon">☷</span></div><div class="stat-value">${totalQ}</div><div class="stat-foot">Từ các tài liệu đã nhập</div></div><div class="card stat"><div class="stat-top"><span>Lượt làm bài</span><span class="stat-icon">◷</span></div><div class="stat-value">${state.history.length}</div><div class="stat-foot">Lịch sử được lưu trên máy</div></div><div class="card stat"><div class="stat-top"><span>Điểm trung bình</span><span class="stat-icon">↗</span></div><div class="stat-value">${state.history.length?avg.toFixed(1):'—'}${state.history.length?'<span style="font-size:14px;color:#8a91a4"> / 10</span>':''}</div><div class="stat-foot">${state.history.length?'Dựa trên các lượt đã hoàn thành':'Hãy làm bài đầu tiên'}</div></div></div>
<div class="grid-2"><section class="card section-card"><h3 class="section-title">Bài tập gần đây <button class="text-link" data-page="assignments">Xem tất cả →</button></h3>${state.assignments.length?`<div class="assignment-list">${state.assignments.slice(-4).reverse().map(a=>assignmentCard(a,true)+`<div class="toolbar" style="justify-content:flex-end;margin-top:-5px"><button class="btn btn-primary btn-sm" data-action="start-test" data-id="${esc(a.id)}">Bắt đầu làm</button></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">📄</div><b>Chưa có bài tập nào</b>Tải lên một file Word đề và file đáp án để bắt đầu.<div style="margin-top:14px"><button class="btn btn-primary" data-action="go-create">Tạo bài tập đầu tiên</button></div></div>`}</section><section class="card section-card"><h3 class="section-title">Ôn lại lỗi sai <button class="text-link" data-page="mistakes">Mở sổ lỗi →</button></h3>${state.notes.length?`<div class="assignment-list">${state.notes.slice(-4).reverse().map(n=>`<div class="assignment-row"><div class="subject-icon" style="background:var(--redbg);color:var(--red)">↻</div><div class="assignment-info"><strong>${esc(n.title||'Câu hỏi cần ôn')}</strong><span>${esc(n.note||n.prompt||'Chưa ghi chú')}</span></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">✦</div><b>Sổ lỗi sai đang trống</b>Sau khi làm bài, các câu trả lời sai sẽ được ghi lại tại đây.</div>`}</section></div>`}
function renderAssignments(){return `<div class="heading-row"><div><div class="eyebrow">THƯ VIỆN CỦA BẠN</div><h1 class="page-title">Bài tập</h1><p class="page-desc">Quản lý đề đã tải lên và bắt đầu một lượt kiểm tra.</p></div><button class="btn btn-primary" data-action="go-create">＋ Đăng bài tập</button></div><div class="filters"><input id="assignment-search" placeholder="Tìm theo tên bài hoặc môn học…"><span class="pill neutral" style="align-self:center">${state.assignments.length} bài</span></div><div class="assignment-list" id="assign-list">${state.assignments.length?state.assignments.slice().reverse().map(a=>assignmentCard(a)).join(''):`<div class="empty"><div class="empty-icon">📚</div><b>Chưa có bài tập</b>Nhấn “Đăng bài tập” để nhập đề Word và đáp án.</div>`}</div>`}
function createForm(){const d=state.draft;return `<div class="heading-row"><div><div class="eyebrow">TẠO BÀI KIỂM TRA</div><h1 class="page-title">${state.editingId?'Chỉnh sửa bài tập':'Đăng bài tập mới'}</h1><p class="page-desc">Nhập đề và đáp án từ Word. Kiểm tra nội dung được nhận diện trước khi lưu.</p></div></div><section class="card section-card"><h3 class="section-title">1. Thông tin bài tập</h3><div class="form-grid"><div class="field"><label for="d-title">Tên bài tập *</label><input id="d-title" data-draft="title" value="${esc(d.title)}" placeholder="Ví dụ: Ôn tập giữa kỳ — Chương 1"></div><div class="field"><label for="d-subject">Môn học</label><input id="d-subject" data-draft="subject" value="${esc(d.subject)}" placeholder="Ví dụ: Toán học"></div><div class="field"><label for="d-group">Lớp / Nhóm</label><input id="d-group" data-draft="group" value="${esc(d.group)}" placeholder="Ví dụ: 12A1"></div><div class="field"><label for="d-duration">Thời gian (phút)</label><input id="d-duration" data-draft="duration" type="number" min="1" max="300" value="${esc(d.duration||30)}"></div><div class="field full"><label for="d-desc">Hướng dẫn (không bắt buộc)</label><textarea id="d-desc" data-draft="description" placeholder="Ghi chú cho bài làm…" style="min-height:72px">${esc(d.description)}</textarea></div></div>
<div class="split"></div><h3 class="section-title">2. Tải lên tài liệu Word</h3><div class="upload-grid"><div class="upload-box ${d.qFile?'ready':''}"><div class="upload-head"><div class="upload-symbol">📄</div><div><b>File đề bài</b><small>Word .docx hoặc văn bản .txt</small></div></div><input id="question-file" type="file" class="file-input" accept=".docx,.txt,text/plain"><div class="file-name" id="q-file-name">${d.qFile?'✓ '+esc(d.qFile):'Chưa chọn file đề'}</div></div><div class="upload-box ${d.aFile?'ready':''}"><div class="upload-head"><div class="upload-symbol">🗝</div><div><b>File đáp án chuẩn</b><small>File riêng, chỉ chứa đáp án càng tốt</small></div></div><input id="answer-file" type="file" class="file-input" accept=".docx,.txt,text/plain"><div class="file-name" id="a-file-name">${d.aFile?'✓ '+esc(d.aFile):'Chưa chọn file đáp án'}</div></div></div><div class="notice">Định dạng đề dễ nhận diện nhất: mỗi câu bắt đầu bằng <b>“Câu 1.”</b>; phương án A., B., C., D. hoặc mệnh đề a), b), c), d) nằm trên từng dòng. File đáp án có thể ghi <b>1. A</b>, <b>Câu 2: Đúng, Sai, Đúng, Sai</b> hoặc <b>Câu 3: 12,5</b>. Sau khi phân tích, hãy rà soát lại nội dung trước khi lưu.</div><div class="field" style="margin-top:16px"><label for="raw-q">Văn bản đề bài (có thể chỉnh/dán vào đây nếu Word khó đọc)</label><textarea id="raw-q" data-draft="questionText" placeholder="Tải file Word lên, hoặc dán văn bản đề vào đây…" style="min-height:135px">${esc(d.questionText)}</textarea></div><div class="field" style="margin-top:13px"><label for="raw-a">Văn bản đáp án chuẩn</label><textarea id="raw-a" data-draft="answerText" placeholder="Ví dụ: Câu 1: A&#10;Câu 2: Đúng, Sai, Đúng, Sai&#10;Câu 3: 12,5" style="min-height:100px">${esc(d.answerText)}</textarea></div><div class="sticky-actions"><span class="small muted">Hỗ trợ: trắc nghiệm A–D · đúng/sai · trả lời ngắn</span><button class="btn btn-primary" data-action="parse-docs">Phân tích đề & đáp án　→</button></div></section>${d.questions.length?renderQuestionEditor():''}`}
function getKeyDisplay(q){if(Array.isArray(q.correct))return q.correct.join(', ');return q.correct??''}
function renderQuestionEditor(){const qs=state.draft.questions;return `<section class="card section-card" style="margin-top:18px"><div class="heading-row" style="margin-bottom:12px;align-items:center;flex-direction:row"><div><h3 class="section-title" style="margin:0 0 5px">3. Kiểm tra và chỉnh câu hỏi</h3><p class="small muted" style="margin:0">${qs.length} câu đã nhận diện · Nội dung có thể sửa trực tiếp</p></div><button class="btn btn-outline btn-sm" data-action="add-question">＋ Thêm câu</button></div><div class="notice ${qs.some(q=>!q.correct||Array.isArray(q.correct)&&q.correct.some(x=>!x))?'warn':''}">Hãy kiểm tra loại câu, phương án và đáp án chuẩn. Với câu đúng/sai, nhập các đáp án theo thứ tự mệnh đề, phân tách bằng dấu phẩy.</div><div class="editor-list">${qs.map((q,i)=>`<div class="editor-q" data-editor-q="${i}"><div class="editor-q-head"><div style="display:flex;align-items:center;gap:10px"><span class="q-badge">${i+1}</span><b>Câu ${i+1}</b></div><div class="toolbar"><select data-q-field="type" data-q-index="${i}" aria-label="Loại câu hỏi" style="border:1px solid var(--line);padding:7px;border-radius:9px;background:#fff;font-size:11px"><option value="mcq" ${q.type==='mcq'?'selected':''}>Trắc nghiệm A–D</option><option value="tf" ${q.type==='tf'?'selected':''}>Đúng / Sai</option><option value="short" ${q.type==='short'?'selected':''}>Trả lời ngắn</option></select><button class="btn btn-danger btn-sm" data-action="remove-question" data-index="${i}">Xóa</button></div></div><div class="field"><label>Nội dung câu hỏi</label><textarea data-q-field="prompt" data-q-index="${i}" style="min-height:68px">${esc(q.prompt)}</textarea></div>${q.type==='mcq'?`<div class="field"><label>Các phương án</label><div class="option-grid">${['A','B','C','D'].map((l,j)=>`<div class="option-label"><span class="option-letter">${l}</span><input data-q-field="option-${l}" data-q-index="${i}" value="${esc((q.options.find(o=>o.label===l)||{}).text||'')}" placeholder="Nội dung phương án ${l}"></div>`).join('')}</div></div>`:q.type==='tf'?`<div class="field"><label>Các mệnh đề (mỗi dòng một mệnh đề)</label><textarea data-q-field="statements" data-q-index="${i}" style="min-height:95px">${esc(q.statements.map(s=>s.label+') '+s.text).join('\n'))}</textarea><span class="help">Ví dụ: a) Trái Đất quay quanh Mặt Trời. Mỗi dòng sẽ được nhận diện là một mệnh đề.</span></div>`:''}<div class="field"><label>${q.type==='tf'?'Đáp án chuẩn (theo thứ tự mệnh đề)':q.type==='mcq'?'Đáp án chuẩn (A, B, C hoặc D)':'Đáp án chuẩn'}</label><input data-q-field="correct" data-q-index="${i}" value="${esc(getKeyDisplay(q))}" placeholder="${q.type==='tf'?'Đúng, Sai, Đúng, Sai':q.type==='mcq'?'A':'Nhập đáp án'}"><span class="help">${q.type==='tf'?'Chấp nhận Đúng/Sai hoặc Đ/S, ngăn cách bằng dấu phẩy.':q.type==='mcq'?'Nhập một chữ cái: A, B, C hoặc D.':'Có thể là số hoặc văn bản ngắn; phần mềm bỏ qua khác biệt hoa/thường và dấu cách khi so sánh.'}</span></div></div>`).join('')}</div><div class="sticky-actions"><button class="btn btn-outline" data-action="back-upload">← Sửa văn bản nguồn</button><button class="btn btn-primary" data-action="save-assignment">Lưu bài tập và sẵn sàng làm　✓</button></div></section>`}
function repositoryCard(p){const paperId=String(p.id||'');return `<article class="card section-card" style="box-shadow:none;margin-bottom:12px"><div style="display:flex;align-items:flex-start;gap:14px"><div class="subject-icon">${(p.subject||'').toLowerCase().includes('toán')?'∑':(p.subject||'').toLowerCase().includes('anh')?'文':'📘'}</div><div style="flex:1;min-width:0"><h3 style="font-size:16px;margin:2px 0 7px;overflow-wrap:anywhere">${esc(p.title||'Đề chưa đặt tên')}</h3><div class="small muted">${esc(p.subject||'Chưa phân môn')}${p.grade?' · '+esc(p.grade):''} · ${Number(p.question_count||p.questions?.length||0)} câu · ${Number(p.duration)||30} phút</div><div class="small muted" style="margin-top:5px">Đăng bởi <b>${esc(p.uploader_name||'Ẩn danh')}</b>${p.created_at?' · '+esc(dateFmt(p.created_at)):''}</div>${p.description?`<p class="small" style="line-height:1.6;margin:10px 0 0">${esc(p.description)}</p>`:''}</div></div><div class="toolbar" style="justify-content:flex-end;margin-top:15px"><button class="btn btn-primary btn-sm" data-action="use-community-paper" data-id="${esc(paperId)}">Làm đề này ↗</button></div></article>`}
function renderRepositoryList(){const node=document.getElementById('repository-list');if(!node)return;const q=state.repoSearch.trim().toLowerCase();const subj=state.repoSubject;const papers=state.repositoryPapers.filter(p=>(!subj||p.subject===subj)&&(!q||`${p.title||''} ${p.subject||''} ${p.grade||''} ${p.description||''} ${p.uploader_name||''}`.toLowerCase().includes(q)));node.innerHTML=papers.length?papers.map(repositoryCard).join(''):`<div class="empty"><div class="empty-icon">${state.repositoryStatus==='loading'?'⟳':'📚'}</div><b>${state.repositoryStatus==='loading'?'Đang tải kho đề…':state.repositoryStatus==='not-configured'?'Kho đề chung chưa được cấu hình':'Chưa tìm thấy đề phù hợp'}</b>${state.repositoryStatus==='not-configured'?'Hãy cấu hình Supabase trong phần SUPABASE_CONFIG ở đầu file index.html và tạo bảng theo file supabase_setup.sql.':'Thử từ khóa khác hoặc nhấn “Tải lại kho đề”.'}</div>`}
function renderRepository(){const ready=cloudReady();const subjects=[...new Set(state.repositoryPapers.map(p=>p.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));return `<div class="heading-row"><div><div class="eyebrow">CHIA SẺ KIẾN THỨC</div><h1 class="page-title">Kho đề cộng đồng</h1><p class="page-desc">Tìm kiếm và làm thử đề do mọi người đăng tải. Đề đã đăng được chia sẻ giữa các thiết bị qua cơ sở dữ liệu chung.</p></div><button class="btn btn-primary" data-action="refresh-repository">⟳ Tải lại kho đề</button></div>${!ready?`<div class="notice warn"><b>Kho đề đang ở chế độ chưa kết nối.</b><br>App HTML tĩnh không thể tự đồng bộ giữa nhiều người nếu chưa có máy chủ chung. Hãy tạo dự án Supabase, chạy file <code>supabase_setup.sql</code>, rồi điền <code>url</code> và <code>anonKey</code> vào <code>SUPABASE_CONFIG</code> ở gần đầu file <code>index.html</code>. Hướng dẫn nằm trong README đi kèm.</div>`:state.repositoryStatus==='error'?`<div class="notice warn">Không thể tải kho đề: ${esc(state.repositoryError||'Lỗi kết nối')}. Kiểm tra URL, khóa và chính sách SQL.</div>`:''}<div class="card section-card" style="margin-bottom:18px"><div class="form-grid"><div class="field"><label for="repo-search">Tìm đề</label><input id="repo-search" value="${esc(state.repoSearch)}" placeholder="Tên đề, môn học, lớp, người đăng…"></div><div class="field"><label for="repo-subject">Lọc theo môn học</label><select id="repo-subject"><option value="">Tất cả môn học</option>${subjects.map(x=>`<option value="${esc(x)}" ${state.repoSubject===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="small muted" style="margin-top:12px">${state.repositoryPapers.length} đề trong kho${state.repositoryStatus==='loading'?' · đang đồng bộ…':ready?' · dữ liệu dùng chung':''}</div></div><div id="repository-list">${state.repositoryPapers.length?state.repositoryPapers.map(repositoryCard).join(''):`<div class="empty"><div class="empty-icon">📚</div><b>${ready?'Kho đề chưa có bài đăng':'Kho đề chung chưa được cấu hình'}</b>${ready?'Hãy đăng đề đầu tiên từ mục Bài tập.':'Cấu hình máy chủ chung để mọi người cùng sử dụng kho đề.'}</div>`}</div><div class="notice">🔐 <b>Lưu ý khi đăng công khai:</b> chỉ chia sẻ đề bạn có quyền đăng. Vì đây là kho công cộng cho phép đăng không cần tài khoản, nội dung có thể bị spam. Đáp án dùng để chấm được gửi xuống trình duyệt người làm bài, nên không dùng cho đề thi bí mật hoặc bài kiểm tra có tính bảo mật cao.</div>`}
async function refreshRepository(showMessage=true){if(!cloudReady()){state.repositoryStatus='not-configured';state.repositoryError='';if(state.page==='repository')render();return}state.repositoryStatus='loading';state.repositoryError='';if(state.page==='repository')render();try{const url=`${cloudUrl()}/rest/v1/${encodeURIComponent(SUPABASE_CONFIG.table)}?select=id,title,subject,grade,description,duration,uploader_name,questions,question_count,created_at&order=created_at.desc&limit=200`;const res=await fetch(url,{headers:cloudHeaders()});if(!res.ok){const body=await res.text();throw new Error(body.slice(0,220)||`HTTP ${res.status}`)}const data=await res.json();state.repositoryPapers=Array.isArray(data)?data:[];state.repositoryStatus='ready';if(state.page==='repository')render();if(showMessage)toast(`Đã tải ${state.repositoryPapers.length} đề từ kho cộng đồng.`)}catch(err){state.repositoryStatus='error';state.repositoryError=err.message||'Lỗi kết nối';if(state.page==='repository')render();if(showMessage)toast('Không tải được kho đề. Hãy kiểm tra cấu hình và SQL.')}}
async function publishPaper(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;if(!cloudReady()){toast('Kho đề chưa kết nối. Mở mục Kho đề cộng đồng để xem hướng dẫn cấu hình.');return}if(!Array.isArray(a.questions)||!a.questions.length){toast('Bài tập chưa có câu hỏi hợp lệ.');return}let prior='';try{prior=localStorage.getItem('hoctot_uploader_name')||''}catch(e){}const name=window.prompt('Tên hiển thị công khai khi đăng đề:',prior||'');if(name===null)return;const author=String(name||'').trim().slice(0,80)||'Ẩn danh';if(!confirm(`Đăng “${a.title}” công khai lên Kho đề cộng đồng với tên “${author}”? Những người truy cập trang có thể xem và làm đề này.`))return;const payload={title:String(a.title).slice(0,180),subject:String(a.subject||'').slice(0,80),grade:String(a.group||'').slice(0,80),description:String(a.description||'').slice(0,2000),duration:Math.max(1,Math.min(300,Number(a.duration)||30)),uploader_name:author,questions:a.questions,question_count:a.questions.length};try{const res=await fetch(`${cloudUrl()}/rest/v1/${encodeURIComponent(SUPABASE_CONFIG.table)}`,{method:'POST',headers:cloudHeaders({'Prefer':'return=minimal'}),body:JSON.stringify(payload)});if(!res.ok){const msg=(await res.text()).slice(0,250);throw new Error(msg||`HTTP ${res.status}`)}try{localStorage.setItem('hoctot_uploader_name',author)}catch(e){}toast('Đã đăng đề lên kho cộng đồng!');await refreshRepository(false);if(state.page==='repository')render()}catch(err){toast('Đăng đề thất bại: '+(err.message||'Lỗi kết nối').slice(0,150))}}
function useCommunityPaper(id){const p=state.repositoryPapers.find(x=>String(x.id)===String(id));if(!p)return;if(!Array.isArray(p.questions)||!p.questions.length){toast('Đề này không có dữ liệu câu hỏi hợp lệ.');return}let local=state.assignments.find(x=>x.sourceCloudId===p.id);if(!local){local={id:'a_cloud_'+Date.now(),title:String(p.title||'Đề cộng đồng'),subject:p.subject||'',group:p.grade||'',duration:Number(p.duration)||30,description:p.description||'',questions:JSON.parse(JSON.stringify(p.questions)),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),sourceCloudId:p.id};state.assignments.push(local);persist()}startTest(local.id);toast('Đã mở đề cộng đồng. Kết quả của bạn sẽ lưu trên thiết bị này.')}
function renderHistory(){const rows=state.history.slice().reverse().filter(h=>(h.title+' '+(h.subject||'')).toLowerCase().includes(state.historySearch.toLowerCase()));return `<div class="heading-row"><div><div class="eyebrow">THEO DÕI TIẾN ĐỘ</div><h1 class="page-title">Lịch sử làm bài</h1><p class="page-desc">Xem lại điểm số và từng câu trả lời của các lượt kiểm tra trước.</p></div></div><div class="filters"><input id="history-search" placeholder="Tìm bài kiểm tra…" value="${esc(state.historySearch)}"><span class="pill neutral">${rows.length} lượt</span></div><div class="assignment-list">${rows.length?rows.map(h=>`<div class="history-item"><div><h3>${esc(h.title)}</h3><div class="small muted">${dateFmt(h.date)} · ${h.total} câu · ${h.correctCount} câu đúng</div></div><div style="text-align:right"><div class="history-score">${Number(h.score).toFixed(1)}<span style="font-size:11px;color:#959bad">/10</span></div><button class="btn btn-outline btn-sm" data-action="open-history" data-id="${esc(h.id)}">Xem lại</button></div></div>`).join(''):`<div class="empty"><div class="empty-icon">◷</div><b>Chưa có lịch sử</b>Sau khi hoàn thành một bài kiểm tra, điểm số sẽ xuất hiện tại đây.</div>`}</div>`}

function render(){updateCrumb();let html='';if(state.page==='dashboard')html=renderDashboard();else if(state.page==='assignments')html=renderAssignments();else if(state.page==='repository')html=renderRepository();else if(state.page==='create')html=createForm();else if(state.page==='test')html=renderTest();else if(state.page==='result')html=renderResult(state.lastAttempt);else if(state.page==='history')html=renderHistory();else if(state.page==='mistakes')html=renderMistakes();view.innerHTML=html;if(state.page==='repository')renderRepositoryList();}
function resetDraft(){state.draft={title:'',subject:'',group:'',duration:30,description:'',questionText:'',answerText:'',questions:[],keyMap:{},qFile:'',aFile:''};state.editingId=null}
function startCreate(){if(state.editingId===null && state.page!=='create')resetDraft();state.page='create';render()}
function parseQuestionText(raw){const text=String(raw||'').replace(/\r/g,'').replace(/[\u00a0]/g,' ');let lines=text.split('\n').map(s=>s.trim()).filter(s=>s.length>0);let starts=[];const re=/^(?:Câu|Cau|Question|Q)\s*(\d{1,3})\s*[.:)\-]\s*(.*)$/i;const numbered=/^(\d{1,3})[.)]\s+(.+)$/;
 for(let i=0;i<lines.length;i++){let m=lines[i].match(re);if(!m)m=lines[i].match(numbered);if(m){starts.push({index:i,num:Number(m[1]),first:m[2]||''})}}
 if(!starts.length){return []}const qs=[];for(let si=0;si<starts.length;si++){const st=starts[si],end=si+1<starts.length?starts[si+1].index:lines.length;let block=[st.first,...lines.slice(st.index+1,end)].filter(Boolean);let promptLines=[],options=[],statements=[];
   for(let line of block){
    // Split common inline choice lists such as "A. ... B. ... C. ... D. ..." when they are on one paragraph.
    const inlineOpt=line.match(/(?:^|\s)(?:A|B|C|D)[.)]\s+/);
    if(inlineOpt && !/^[a-d][.)]\s+/i.test(line) && !/^[A-D][.)]\s+/.test(line)){
      const parts=line.split(/(?=\s[A-D][.)]\s+)/);if(parts.length>1){if(parts[0].trim())promptLines.push(parts[0].trim());line=parts.slice(1).map(x=>x.trim()).join('\n');for(const sub of line.split('\n')){const mm=sub.match(/^([A-D])[.)]\s*(.*)$/i);if(mm)options.push({label:mm[1].toUpperCase(),text:mm[2].trim()});else if(sub.trim())promptLines.push(sub.trim())}continue;}
    }
    let mo=line.match(/^([A-D])[.)\:]\s*(.+)$/);if(mo){options.push({label:mo[1].toUpperCase(),text:mo[2].trim()});continue}
    let ms=line.match(/^\(?([a-d])\)?[.)\:]\s*(.+)$/i);if(ms){statements.push({label:ms[1].toLowerCase(),text:ms[2].trim()});continue}
    promptLines.push(line);
   }
   let type=options.length>=2?'mcq':statements.length>=2?'tf':'short';let prompt=promptLines.join('\n').trim();if(!prompt && !options.length && !statements.length)continue;
   qs.push({id:st.num||qs.length+1,prompt,type,options:type==='mcq'?['A','B','C','D'].map(l=>({label:l,text:(options.find(o=>o.label===l)||{}).text||''})):[],statements:type==='tf'?statements:[],correct:type==='tf'?[]:''});
 }
 return qs;
}
function splitAnswerTokens(s){let str=String(s||'').replace(/\b(?:đáp án|đáp an|answer key|answer)\b\s*[:：]?/ig,'').trim();if(!str)return [];
 const tokens=str.match(/Đúng|Sai|Dung|True|False|(?<![\p{L}\p{N}])[ĐS](?![\p{L}\p{N}])/giu);if(tokens && tokens.length>1)return tokens.map(normTF);
 if(tokens && tokens.length===1 && /^(?:đúng|dung|sai|true|false|đ|s)$/iu.test(str.replace(/[\s,;.)]+/g,'')))return [normTF(tokens[0])];
 return [];
}
function normTF(x){const t=String(x).toLowerCase();return ['đúng','dung','true','đ'].includes(t)?'Đúng':'Sai'}
function parseKeyText(raw,questions){const map={};const lines=String(raw||'').replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
 for(let line of lines){
   // The main supported key format: "Câu 1: A", "1. A", "Câu 2: Đúng, Sai, ...", "3: 12,5".
   let m=line.match(/^(?:Câu|Cau|Question|Q)\s*(\d{1,3})\s*[:.)\-]?\s*(.*?)\s*$/i);if(!m)m=line.match(/^(\d{1,3})\s*[:.)\-]\s*(.*?)\s*$/);if(!m)m=line.match(/^(\d{1,3})\s+(.+)$/);
   if(m){let n=Number(m[1]),tail=m[2]||'';tail=tail.replace(/^\s*(?:đáp án|đáp an|answer)\s*[:：]?\s*/i,'').trim();const q=questions.find(q=>q.id===n)||questions[n-1];if(!tail)continue;
     let tf=splitAnswerTokens(tail);
     if(tf.length>=2 || (q&&q.type==='tf'&&tf.length===1)){map[n]=tf;continue;}
     if(q&&q.type==='mcq'){const a=tail.match(/(?:^|[^A-Za-z])([A-D])(?:$|[^A-Za-z])/i);if(a){map[n]=a[1].toUpperCase();continue}}
     // Single letter answer keys, including compact forms like "1 A".
     const one=tail.match(/^\(?([A-D])\)?[.)]?(?:\s|$)/i);if(one){map[n]=one[1].toUpperCase();continue}
     // True/false pair written as a) Đúng, b) Sai etc.
     if(/(?:^|\s)[a-d][).]/i.test(tail)&&tf.length){map[n]=tf;continue}
     map[n]=tail.replace(/^[=:—–-]\s*/,'').trim();
   }
 }
 // Support compact multiple-choice keys on one line: "1A 2C 3B" or "1. A; 2. B".
 const compact=/\b(\d{1,3})\s*[:.)-]?\s*([A-D])\b/gi;let compactMatch;while((compactMatch=compact.exec(raw))!==null){const n=Number(compactMatch[1]);if(map[n]===undefined)map[n]=compactMatch[2].toUpperCase()}
 // Fill by position if question numbering is not sequential.
 questions.forEach((q,i)=>{if(map[q.id]===undefined && map[i+1]!==undefined)map[q.id]=map[i+1]});
 return map;
}
function applyKeyMap(qs,map){qs.forEach(q=>{let val=map[q.id];if(val===undefined)val=map[qs.indexOf(q)+1];if(val===undefined)return;if(Array.isArray(val)){if(q.type==='short'&&val.length>1)q.type='tf';if(q.type==='tf')q.correct=val;else q.correct=val.join(', ')}else{if(q.type==='mcq')q.correct=String(val).toUpperCase();else if(q.type==='tf'){const tokens=splitAnswerTokens(String(val));q.correct=tokens.length?tokens:String(val).split(/[,;|]/).map(normTF)}else q.correct=String(val)}})}
function parseDraft(){const d=state.draft;if(!d.questionText.trim()){toast('Bạn cần tải lên hoặc dán văn bản đề bài trước.');return}let qs=parseQuestionText(d.questionText);if(!qs.length){toast('Chưa nhận diện được câu hỏi. Hãy kiểm tra định dạng “Câu 1.” hoặc đánh số 1., 2.');return}const map=parseKeyText(d.answerText,qs);applyKeyMap(qs,map);state.draft.questions=qs;state.draft.keyMap=map;render();toast(`Đã nhận diện ${qs.length} câu. Hãy rà soát đáp án chuẩn trước khi lưu.`)}
async function readTextFile(file){if(!file)return '';const ext=file.name.toLowerCase().split('.').pop();if(ext==='txt')return await file.text();if(ext!=='docx')throw new Error('Chỉ hỗ trợ file Word .docx hoặc văn bản .txt. File .doc cũ cần lưu lại thành .docx.');if(!window.mammoth)throw new Error('Không tải được bộ đọc Word (Mammoth). Hãy kết nối Internet rồi tải lại trang, hoặc dán văn bản vào ô bên dưới.');const ab=await file.arrayBuffer();const result=await window.mammoth.extractRawText({arrayBuffer:ab});return result.value||''}
function normalizeCorrect(q){let c=q.correct;if(q.type==='mcq')return String(c||'').trim().toUpperCase().replace(/[^A-D]/g,'').slice(0,1);if(q.type==='tf'){if(Array.isArray(c))return c.map(normTF);return String(c||'').split(/[,;|\n]+/).map(x=>x.trim()).filter(Boolean).map(normTF)}return String(c??'').trim()}
function cleanQuestionsBeforeSave(){const qs=state.draft.questions.map((q,i)=>{let o=JSON.parse(JSON.stringify(q));o.id=Number(o.id)||i+1;o.prompt=String(o.prompt||'').trim();if(o.type==='mcq'){o.options=['A','B','C','D'].map(l=>({label:l,text:String((o.options||[]).find(x=>x.label===l)?.text||'').trim()}));o.correct=normalizeCorrect(o)}else if(o.type==='tf'){if(typeof o.statements==='string')o.statements=parseStatementText(o.statements);o.correct=normalizeCorrect(o);if(o.statements.length!==o.correct.length){/* leave for explicit review */}}else{o.options=[];o.statements=[];o.correct=normalizeCorrect(o)}return o});return qs}
function parseStatementText(raw){return String(raw||'').split('\n').map((s,i)=>s.trim()).filter(Boolean).map((s,i)=>{const m=s.match(/^\(?([a-d])\)?[.)\:]?\s*/i);return {label:m?m[1].toLowerCase():String.fromCharCode(97+i),text:m?s.slice(m[0].length).trim():s}})}
function saveAssignment(){const d=state.draft;d.title=d.title.trim();if(!d.title){toast('Hãy nhập tên bài tập.');document.getElementById('d-title')?.focus();return}const qs=cleanQuestionsBeforeSave();if(!qs.length){toast('Chưa có câu hỏi để lưu.');return}const problems=[];qs.forEach((q,i)=>{if(!q.prompt)problems.push(`Câu ${i+1} chưa có nội dung`);if(q.type==='mcq'){if(!['A','B','C','D'].includes(q.correct))problems.push(`Câu ${i+1}: đáp án phải là A/B/C/D`);if(q.options.filter(o=>o.text).length<2)problems.push(`Câu ${i+1}: thiếu phương án`)}else if(q.type==='tf'){if(!q.statements.length)problems.push(`Câu ${i+1}: thiếu mệnh đề`);if(!q.correct.length)problems.push(`Câu ${i+1}: thiếu đáp án đúng/sai`);if(q.correct.length!==q.statements.length)problems.push(`Câu ${i+1}: có ${q.statements.length} mệnh đề nhưng ${q.correct.length} đáp án`)}else if(!String(q.correct||'').trim())problems.push(`Câu ${i+1}: thiếu đáp án chuẩn`)});if(problems.length){toast(problems.slice(0,2).join(' · ')+(problems.length>2?` · và ${problems.length-2} lỗi khác`:''));return}
 let old=state.editingId?state.assignments.find(a=>a.id===state.editingId):null;const obj={id:state.editingId||('a_'+Date.now()),title:d.title,subject:d.subject.trim(),group:d.group.trim(),duration:Math.max(1,Math.min(300,Number(d.duration)||30)),description:d.description.trim(),questions:qs,updatedAt:new Date().toISOString(),createdAt:old?.createdAt||new Date().toISOString()};if(old)state.assignments=state.assignments.map(a=>a.id===obj.id?obj:a);else state.assignments.push(obj);persist();resetDraft();state.page='assignments';render();toast(old?'Đã cập nhật bài tập.':'Đã đăng bài tập thành công.');}
function editAssignment(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;state.editingId=a.id;state.draft={title:a.title,subject:a.subject||'',group:a.group||'',duration:a.duration||30,description:a.description||'',questionText:'',answerText:'',questions:JSON.parse(JSON.stringify(a.questions)),keyMap:{},qFile:'',aFile:''};state.page='create';render();toast('Đang chỉnh sửa câu hỏi và đáp án đã lưu.')}
function removeAssignment(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;if(!confirm(`Xóa bài “${a.title}”? Lịch sử các lượt làm bài cũ vẫn được giữ.`))return;state.assignments=state.assignments.filter(x=>x.id!==id);persist();render();toast('Đã xóa bài tập.')}
function startTest(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;if(timer){clearInterval(timer);timer=null}state.test={assignmentId:id,answers:{},index:0,secondsLeft:(Number(a.duration)||30)*60,startedAt:new Date().toISOString()};state.page='test';render();startTimer()}
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!state.test||state.page!=='test'){return}state.test.secondsLeft--;const el=document.getElementById('time-left');if(el)el.textContent=formatTime(state.test.secondsLeft);if(state.test.secondsLeft<=0){clearInterval(timer);timer=null;submitTest(true)}},1000)}

function answerProvided(q,a){if(q.type==='tf')return Array.isArray(a)&&a.length===q.statements.length&&a.every(Boolean);return String(a??'').trim().length>0}
function renderQuestionInput(q,index){const ans=state.test.answers[q.id];if(q.type==='mcq')return `<div class="answer-list">${q.options.map(o=>`<label class="answer-option ${ans===o.label?'selected':''}"><input type="radio" name="question-${q.id}" value="${o.label}" ${ans===o.label?'checked':''} data-answer-mcq="${q.id}" aria-label="Phương án ${o.label}"><span class="option-dot">${o.label}</span><span>${esc(o.text)}</span></label>`).join('')}</div>`;if(q.type==='tf')return `<div style="margin-top:22px">${q.statements.map((s,i)=>`<div class="tf-row"><div class="tf-copy"><b style="color:var(--primary);margin-right:7px">${esc(s.label||String.fromCharCode(97+i))})</b>${esc(s.text)}</div><div class="tf-controls"><button class="tf-choice ${(ans||[])[i]==='Đúng'?'selected':''}" data-action="tf-answer" data-qid="${q.id}" data-statement="${i}" data-value="Đúng">Đúng</button><button class="tf-choice ${(ans||[])[i]==='Sai'?'selected':''}" data-action="tf-answer" data-qid="${q.id}" data-statement="${i}" data-value="Sai">Sai</button></div></div>`).join('')}</div>`;return `<div class="short-answer"><div class="field"><label>Nhập câu trả lời của bạn</label><input data-answer-short="${q.id}" value="${esc(ans||'')}" placeholder="Nhập đáp án ngắn…" autocomplete="off"></div><div class="small muted" style="margin-top:8px">Với đáp án dạng số, có thể dùng dấu phẩy hoặc dấu chấm thập phân.</div></div>`}
function renderTest(){const a=curAssignment();if(!a)return `<div class="empty">Không tìm thấy bài tập. <button class="btn btn-primary" data-page="assignments">Quay lại bài tập</button></div>`;const q=a.questions[state.test.index]||a.questions[0],i=state.test.index,answered=a.questions.filter(x=>answerProvided(x,state.test.answers[x.id])).length,pct=(i+1)/a.questions.length*100;return `<div class="test-top"><div><div class="eyebrow">ĐANG LÀM BÀI</div><h1 class="page-title" style="font-size:25px;margin-bottom:4px">${esc(a.title)}</h1><span class="small muted">${esc(a.subject||'')} ${a.group?'· '+esc(a.group):''}</span></div><div class="card" style="padding:10px 13px;display:flex;align-items:center;gap:8px;border-radius:12px"><span style="color:var(--primary)">◷</span><div><div class="tiny muted">THỜI GIAN CÒN</div><b id="time-left" style="font-size:17px;letter-spacing:.5px">${formatTime(state.test.secondsLeft)}</b></div></div></div>${a.description?`<div class="notice" style="margin:0 0 15px">${esc(a.description)}</div>`:''}<div style="display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)"><span>Câu ${i+1} / ${a.questions.length}</span><span>Đã trả lời ${answered} / ${a.questions.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="test-layout"><section class="card question-card"><div class="question-meta"><span class="pill">Câu hỏi ${i+1}</span>${typePill(q.type)}</div><div class="question-prompt">${esc(q.prompt)}</div>${renderQuestionInput(q,i)}<div class="test-nav-buttons"><button class="btn btn-outline" data-action="question-prev" ${i===0?'disabled':''}>← Câu trước</button>${i<a.questions.length-1?`<button class="btn btn-primary" data-action="question-next">Câu tiếp theo →</button>`:`<button class="btn btn-primary" data-action="submit-test">Nộp bài ✓</button>`}</div></section><aside class="card question-nav"><h3>Danh sách câu</h3><div class="number-grid">${a.questions.map((x,j)=>`<button class="number-btn ${j===i?'current':''} ${answerProvided(x,state.test.answers[x.id])?'done':''}" data-action="jump-question" data-index="${j}" title="Câu ${j+1}">${j+1}</button>`).join('')}</div><div class="nav-legend"><span><i class="legend-dot current"></i>Đang làm</span><span><i class="legend-dot"></i>Đã trả lời</span></div><div class="test-side-info">💡 <b>Lưu ý</b><br>Chọn đáp án cho từng câu. Bạn có thể chuyển qua lại giữa các câu trước khi nộp bài.<br><br>Đã trả lời: <b>${answered}/${a.questions.length}</b></div><button class="btn btn-primary" style="width:100%;margin-top:15px" data-action="submit-test">Nộp bài kiểm tra</button><button class="btn btn-outline" style="width:100%;margin-top:8px" data-action="exit-test">Thoát bài</button></aside></div>`}
function tfExpected(q){return Array.isArray(q.correct)?q.correct:[]}
function normStr(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/\s+/g,'').replace(/[.,;:!?()\[\]{}]/g,'')}
function answerDisplay(q,a){if(q.type==='tf')return Array.isArray(a)?a.map((x,i)=>`${q.statements[i]?.label||String.fromCharCode(97+i)}) ${x||'Chưa chọn'}`).join('; '):'Chưa trả lời';return String(a??'').trim()||'Chưa trả lời'}
function correctDisplay(q){if(q.type==='tf')return tfExpected(q).map((x,i)=>`${q.statements[i]?.label||String.fromCharCode(97+i)}) ${x}`).join('; ');if(q.type==='mcq'){const opt=q.options.find(o=>o.label===q.correct);return q.correct+(opt?.text?` — ${opt.text}`:'')}return String(q.correct??'')}
function isCorrect(q,ans){if(q.type==='mcq')return String(ans||'').trim().toUpperCase()===String(q.correct||'').trim().toUpperCase();if(q.type==='tf'){let exp=tfExpected(q);let got=Array.isArray(ans)?ans:[];return exp.length===got.length&&exp.every((x,i)=>normStr(x)===normStr(got[i]))}const s=String(ans??'').trim(),c=String(q.correct??'').trim();if(!s||!c)return false;const sn=s.replace(',','.'),cn=c.replace(',','.');if(sn!==''&&cn!==''&&Number.isFinite(Number(sn))&&Number.isFinite(Number(cn)))return Math.abs(Number(sn)-Number(cn))<=1e-6;return normStr(s)===normStr(c)}
function scoreTest(a,answers){let max=0,earned=0,results=[];a.questions.forEach((q,i)=>{let ans=answers[q.id];let points=1,got=0;if(q.type==='tf'){const exp=tfExpected(q),actual=Array.isArray(ans)?ans:[];points=Math.max(1,exp.length);for(let j=0;j<exp.length;j++)if(actual[j]&&normStr(actual[j])===normStr(exp[j]))got++;}else{got=isCorrect(q,ans)?1:0}max+=points;earned+=got;results.push({question:q,questionNumber:i+1,userAnswer:answerDisplay(q,ans),correctAnswer:correctDisplay(q),rawAnswer:ans??'',correct:got===points,got,points})});return {results,score:max?Math.round((earned/max*10)*100)/100:0,earned,max,correctCount:results.filter(x=>x.correct).length}}
function submitTest(auto=false){if(!state.test)return;if(timer){clearInterval(timer);timer=null}const a=curAssignment();if(!a)return;const answers=JSON.parse(JSON.stringify(state.test.answers));const scored=scoreTest(a,answers);const attempt={id:'h_'+Date.now(),assignmentId:a.id,title:a.title,subject:a.subject,date:new Date().toISOString(),total:a.questions.length,correctCount:scored.correctCount,score:scored.score,earned:scored.earned,max:scored.max,results:scored.results.map(r=>({question:r.question,questionNumber:r.questionNumber,userAnswer:r.userAnswer,correctAnswer:r.correctAnswer,rawAnswer:r.rawAnswer,correct:r.correct,got:r.got,points:r.points})),autoSubmitted:auto};state.history.push(attempt);state.lastAttempt=attempt;scored.results.filter(r=>!r.correct).forEach(r=>{const note={id:'n_'+attempt.id+'_'+r.question.id,attemptId:attempt.id,assignmentId:a.id,title:a.title,questionNumber:r.questionNumber,prompt:r.question.prompt,typeLabel:fmtType(r.question.type),date:attempt.date,userAnswer:r.userAnswer,correctAnswer:r.correctAnswer,note:'',};state.notes.push(note)});persist();state.test=null;state.page='result';render();toast(auto?'Hết giờ — bài đã được tự động nộp.':'Đã nộp bài và lưu kết quả.')}
function renderResult(h){if(!h)return `<div class="empty">Chưa có kết quả. <button class="btn btn-primary" data-page="assignments">Quay lại bài tập</button></div>`;const pct=h.max?Math.round(h.earned/h.max*100):0;const resultMarkup=h.results.map(r=>`<article class="review-q ${r.correct?'correct':'wrong'}"><div class="review-title"><span class="review-status ${r.correct?'ok':'no'}">${r.correct?'✓':'×'}</span><div style="flex:1"><b>Câu ${r.questionNumber}</b> <span class="small muted">· ${esc(fmtType(r.question.type))}</span><div class="review-body">${esc(r.question.prompt)}</div></div><span class="pill ${r.correct?'':'warn'}">${r.got}/${r.points} điểm</span></div><div class="answer-compare"><div class="compare-box ${r.correct?'good':'bad'}"><span>Câu trả lời của bạn</span><b>${esc(r.userAnswer)}</b></div><div class="compare-box good"><span>Đáp án chuẩn</span><b>${esc(r.correctAnswer)}</b></div></div>${!r.correct?`<div class="note-area"><label>Ghi chú lỗi sai</label><textarea data-attempt-note="${esc(h.id)}" data-question-num="${r.questionNumber}" placeholder="Ghi lại nguyên nhân sai hoặc kiến thức cần ôn…">${esc(state.notes.find(n=>n.attemptId===h.id&&n.questionNumber===r.questionNumber)?.note||'')}</textarea></div>`:''}</article>`).join('');return `<div class="heading-row"><div><div class="eyebrow">${h.autoSubmitted?'BÀI TỰ ĐỘNG NỘP':'HOÀN THÀNH BÀI KIỂM TRA'}</div><h1 class="page-title">Kết quả làm bài</h1><p class="page-desc">${esc(h.title)} · ${dateFmt(h.date)}</p></div><button class="btn btn-outline" data-page="assignments">← Danh sách bài tập</button></div><section class="score-hero"><div><div class="eyebrow" style="color:#e4e8ff">ĐIỂM CỦA BẠN</div><div class="score-number">${Number(h.score).toFixed(1)}<span style="font-size:20px;font-weight:650"> / 10</span></div><p>${h.correctCount} / ${h.total} câu đúng hoàn toàn · ${pct}% điểm theo trọng số</p></div><div class="score-circle">${pct}%</div></section><div class="result-summary"><div class="result-stat"><span>Câu đúng hoàn toàn</span><b style="color:var(--green)">${h.correctCount}</b></div><div class="result-stat"><span>Câu cần xem lại</span><b style="color:var(--red)">${h.total-h.correctCount}</b></div><div class="result-stat"><span>Tổng câu hỏi</span><b>${h.total}</b></div></div><section><h2 class="section-title">Chi tiết từng câu <span class="small muted" style="font-weight:500">Lỗi sai được tự động đưa vào sổ ôn tập</span></h2><div class="review-list">${resultMarkup}</div></section><div class="sticky-actions"><button class="btn btn-outline" data-page="history">Xem lịch sử</button><button class="btn btn-primary" data-action="retake" data-id="${esc(h.assignmentId)}">Làm lại bài này ↻</button></div>`}
function openHistory(id){const h=state.history.find(x=>x.id===id);if(!h)return;state.lastAttempt=h;state.page='result';render()}
function bindDraftChange(target){if(!target.dataset.draft)return;let key=target.dataset.draft;state.draft[key]=target.value}
function handleQuestionEditor(target){const i=Number(target.dataset.qIndex);const q=state.draft.questions[i];if(!q)return;const field=target.dataset.qField;if(field==='type'){q.type=target.value;if(q.type==='tf'&&!q.statements.length)q.statements=[{label:'a',text:''},{label:'b',text:''}];if(q.type==='mcq'&&!q.options.length)q.options=['A','B','C','D'].map(label=>({label,text:''}));if(q.type==='tf'&&!Array.isArray(q.correct))q.correct=[];if(q.type!=='tf'&&Array.isArray(q.correct))q.correct=q.correct.join(', ');render();return}if(field==='prompt')q.prompt=target.value;else if(field.startsWith('option-')){const label=field.slice(7);let o=q.options.find(x=>x.label===label);if(!o){o={label,text:''};q.options.push(o)}o.text=target.value}else if(field==='statements'){q.statements=parseStatementText(target.value)}else if(field==='correct'){if(q.type==='tf')q.correct=target.value.split(/[,;|\n]+/).map(x=>x.trim()).filter(Boolean).map(normTF);else q.correct=target.value}}
function applyAttemptNote(target){const id=target.dataset.attemptNote,qn=Number(target.dataset.questionNum);const n=state.notes.find(x=>x.attemptId===id&&x.questionNumber===qn);if(n){n.note=target.value;persist()}}
function handleClick(e){const pg=e.target.closest('[data-page]');if(pg&&!pg.dataset.action){setPage(pg.dataset.page);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action; if(a==='go-create'){resetDraft();setPage('create')}else if(a==='parse-docs')parseDraft();else if(a==='save-assignment')saveAssignment();else if(a==='back-upload'){state.draft.questions=[];render()}else if(a==='add-question'){state.draft.questions.push({id:state.draft.questions.length?Math.max(...state.draft.questions.map(q=>Number(q.id)||0))+1:1,prompt:'',type:'mcq',options:['A','B','C','D'].map(label=>({label,text:''})),statements:[],correct:''});render()}else if(a==='remove-question'){state.draft.questions.splice(Number(btn.dataset.index),1);render()}else if(a==='start-test')startTest(btn.dataset.id);else if(a==='publish-paper')publishPaper(btn.dataset.id);else if(a==='refresh-repository')refreshRepository(true);else if(a==='use-community-paper')useCommunityPaper(btn.dataset.id);else if(a==='edit-assignment')editAssignment(btn.dataset.id);else if(a==='delete-assignment')removeAssignment(btn.dataset.id);else if(a==='question-prev'){if(state.test&&state.test.index>0){state.test.index--;render()}}else if(a==='question-next'){const aa=curAssignment();if(aa&&state.test.index<aa.questions.length-1){state.test.index++;render()}}else if(a==='jump-question'){state.test.index=Number(btn.dataset.index);render()}else if(a==='tf-answer'){const qid=btn.dataset.qid,idx=Number(btn.dataset.statement),val=btn.dataset.value;const ans=Array.isArray(state.test.answers[qid])?state.test.answers[qid].slice():Array(curAssignment().questions.find(q=>String(q.id)===qid)?.statements.length||1).fill('');ans[idx]=ans[idx]===val?'':val;state.test.answers[qid]=ans;render()}else if(a==='submit-test'){const a1=curAssignment(),count=a1.questions.filter(q=>answerProvided(q,state.test.answers[q.id])).length;if(count<a1.questions.length&&!confirm(`Bạn mới trả lời ${count}/${a1.questions.length} câu. Vẫn nộp bài?`))return;submitTest(false)}else if(a==='exit-test'){if(confirm('Thoát bài kiểm tra? Các đáp án chưa nộp sẽ không được lưu vào lịch sử.')){if(timer)clearInterval(timer);timer=null;state.test=null;state.page='assignments';render()}}else if(a==='open-history')openHistory(btn.dataset.id);else if(a==='retake')startTest(btn.dataset.id);else if(a==='remove-note'){state.notes=state.notes.filter(n=>n.id!==btn.dataset.id);persist();render();toast('Đã xóa mục khỏi sổ lỗi sai.')}}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){if(b.dataset.page==='create')resetDraft();setPage(b.dataset.page)}});
view.addEventListener('click',handleClick);
view.addEventListener('input',e=>{const t=e.target;if(t.dataset.draft){bindDraftChange(t);return}if(t.dataset.qField){handleQuestionEditor(t);return}if(t.dataset.answerShort){if(state.test)state.test.answers[t.dataset.answerShort]=t.value;const current=t.selectionStart;const scroll=window.scrollY;const v=t.value; // Update progress markers without rebuilding the input the user is typing into.
 const a=curAssignment();if(a){const q=a.questions.find(x=>String(x.id)===t.dataset.answerShort);const done=a.questions.filter(x=>answerProvided(x,state.test.answers[x.id])).length;const label=document.querySelector('.test-side-info');if(label)label.innerHTML=`💡 <b>Lưu ý</b><br>Chọn đáp án cho từng câu. Bạn có thể chuyển qua lại giữa các câu trước khi nộp bài.<br><br>Đã trả lời: <b>${done}/${a.questions.length}</b>`;const ab=document.querySelector('.test-top + div + div span:last-child');if(ab)ab.textContent=`Đã trả lời ${done} / ${a.questions.length}`;document.querySelectorAll('.number-btn').forEach((b,i)=>b.classList.toggle('done',answerProvided(a.questions[i],state.test.answers[a.questions[i].id])))}return}if(t.dataset.noteId){const n=state.notes.find(x=>x.id===t.dataset.noteId);if(n){n.note=t.value;persist()}return}if(t.dataset.attemptNote){applyAttemptNote(t);return}if(t.id==='assignment-search'){const key=t.value.toLowerCase();const filtered=state.assignments.slice().reverse().filter(a=>(a.title+' '+(a.subject||'')+' '+(a.group||'')).toLowerCase().includes(key));const node=document.getElementById('assign-list');if(node)node.innerHTML=filtered.length?filtered.map(a=>assignmentCard(a)).join(''):`<div class="empty">Không tìm thấy bài tập phù hợp.</div>`;return}if(t.id==='repo-search'){state.repoSearch=t.value;renderRepositoryList();return}if(t.id==='history-search'){state.historySearch=t.value;const pos=t.selectionStart;const h=state.historySearch;const rows=state.history.slice().reverse().filter(x=>(x.title+' '+(x.subject||'')).toLowerCase().includes(h.toLowerCase()));const parent=t.closest('.main');const oldScroll=window.scrollY;const replacement=renderHistory();view.innerHTML=replacement;const nt=document.getElementById('history-search');if(nt){nt.focus();nt.setSelectionRange(pos,pos)}window.scrollTo(0,oldScroll);return}if(t.id==='mistake-search'){state.mistakeSearch=t.value;const pos=t.selectionStart,oldScroll=window.scrollY;view.innerHTML=renderMistakes();const nt=document.getElementById('mistake-search');if(nt){nt.focus();nt.setSelectionRange(pos,pos)}window.scrollTo(0,oldScroll)}});
view.addEventListener('change',async e=>{const t=e.target;if(t.id==='repo-subject'){state.repoSubject=t.value;renderRepositoryList();return}if(t.id==='question-file'||t.id==='answer-file'){const file=t.files&&t.files[0];if(!file)return;const isQ=t.id==='question-file';try{const val=await readTextFile(file);if(isQ){state.draft.questionText=val;state.draft.qFile=file.name;const f=document.getElementById('q-file-name');if(f)f.textContent='✓ '+file.name}else{state.draft.answerText=val;state.draft.aFile=file.name;const f=document.getElementById('a-file-name');if(f)f.textContent='✓ '+file.name}const box=t.closest('.upload-box');if(box)box.classList.add('ready');const textArea=document.getElementById(isQ?'raw-q':'raw-a');if(textArea)textArea.value=val;toast(`Đã đọc ${isQ?'đề bài':'đáp án'} từ ${file.name}.`)}catch(err){toast(err.message||'Không thể đọc file.');t.value=''}return}if(t.dataset.qField){handleQuestionEditor(t);return}});
// Keep radio and checkbox-like test answers in memory without re-rendering away focus.
view.addEventListener('change',e=>{const t=e.target;if(t.dataset.answerMcq){state.test.answers[t.dataset.answerMcq]=t.value;const qid=t.dataset.answerMcq;document.querySelectorAll(`input[data-answer-mcq="${qid}"]`).forEach(inp=>inp.closest('.answer-option')?.classList.toggle('selected',inp.checked));const a=curAssignment();if(a){const done=a.questions.filter(q=>answerProvided(q,state.test.answers[q.id])).length;const label=document.querySelector('.test-side-info');if(label)label.innerHTML=`💡 <b>Lưu ý</b><br>Chọn đáp án cho từng câu. Bạn có thể chuyển qua lại giữa các câu trước khi nộp bài.<br><br>Đã trả lời: <b>${done}/${a.questions.length}</b>`;const top=document.querySelector('.test-top');const spans=top?.parentElement?.querySelectorAll('div[style*="justify-content:space-between"] span');if(spans&&spans[1])spans[1].textContent=`Đã trả lời ${done} / ${a.questions.length}`;document.querySelectorAll('.number-btn').forEach((b,i)=>b.classList.toggle('done',answerProvided(a.questions[i],state.test.answers[a.questions[i].id])))} }});
// Inputs inside text areas are persisted in the draft; editor field handlers are delegated above.
window.addEventListener('beforeunload',e=>{if(state.page==='test'&&state.test){e.preventDefault();e.returnValue=''}});
render();
})();
